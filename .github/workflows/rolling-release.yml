name: Rolling release

on:
  push:
    branches:
      - main

# The rolling tag and its prerelease are deliberately moved to each new main
# commit. Repository settings must allow GitHub Actions to write contents.
permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models qml6-module-qt-labs-folderlistmodel fonts-noto-core fonts-dejavu-core fontconfig iproute2 avahi-utils squashfs-tools desktop-file-utils wmctrl xvfb xauth openbox stalonetray

      - name: Build and verify Linux packages
        run: xvfb-run -a -s '-screen 0 1280x900x24' sh -c 'openbox >/tmp/spearhead-openbox.log 2>&1 & stalonetray >/tmp/spearhead-tray.log 2>&1 & sleep 1; exec ./scripts/build.sh'

      - name: Move the rolling tag to this commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force rolling "${GITHUB_SHA}"
          git push --force origin refs/tags/rolling

      - name: Publish the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Rolling build from ${GITHUB_SHA}. This prerelease is replaced on every push to main. Verify downloads with SHA256SUMS; binaries are not code-signed."
          if gh release view rolling >/dev/null 2>&1; then
            gh release edit rolling --title "Rolling build" --notes "$notes" --prerelease --latest=false
            gh release upload rolling dist/* --clobber
          else
            gh release create rolling dist/* --title "Rolling build" --notes "$notes" --prerelease --latest=false --verify-tag
          fi
